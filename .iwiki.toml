
# The code graph below indexes this repository's Bash and Python sources. It is
# built by a local Git/stdio server, so a launch that registers only the remote
# transport cannot refresh it and its published snapshot goes stale.
read = ["iclaude", "icodex", "iwiki-mcp", "devops"]
write = ["icodex", "devops"]
primary = "icodex"

# GWT specification policy for every visible local domain.
# Choose one value:
# - "disabled": keep specification pages as ordinary Markdown; semantic tools are off.
# - "optional": report advisory findings and project only valid scenarios (recommended).
# - "strict": reject invalid specification mutations atomically.
# Ordinary Wiki pages work in every mode and never require the code graph.
[specifications]
mode = "strict"


[code_graph]
enabled = true
languages = ["python","bash"]
auto_rebuild = "bounded"
max_rebuild_seconds = 1800
max_full_rebuild_seconds = 1800
max_file_bytes = 100000000
max_total_files = 20000
include_tests = false
exclude = [
  ".worktrees/",
  "tests/fixtures/",
  "build/",
  "dist/",
  "*.generated.py",
  "*.generated.ts",
  "vendor/",
  "node_modules/",
  ".superpowers/",
  ".pytest_cache/",
  ".ruff_cache/",
]
typescript_type_boost = false
publish_mode = "mcp"
read_mode = "mcp"
max_snapshot_age_seconds = 86400
max_batch_rows = 1000
max_batch_bytes = 1000000
publication_session_ttl_seconds = 1800
staging_retention_seconds = 86400
staging_cleanup_limit = 100

# Local stdio PostgreSQL examples: replace the Git binding above with exactly
# one block below. Keep IWIKI_DB_PASSWORD out of this file; set
# ICODEX_IWIKI_DB_PASSWORD in .codex_config instead.
#
# Local/internal database for development. `sslmode = "disable"` is appropriate
# only when PostgreSQL listens on this machine.
# read = ["icodex"]
# write = ["icodex"]
# primary = "icodex"
#
# [storage]
# type = "postgres"
# host = "127.0.0.1"
# port = 5432
# database = "iwiki_dev"
# user = "iwiki_app"
# sslmode = "disable"
# iwiki_id = "icodex-dev"
#
# External PostgreSQL database. Use verify-full with a trusted CA and a hostname
# matching the server certificate.
# read = ["icodex"]
# write = ["icodex"]
# primary = "icodex"
#
# [storage]
# type = "postgres"
# host = "db.example.com"
# port = 5432
# database = "iwiki"
# user = "iwiki_app"
# sslmode = "verify-full"
# iwiki_id = "team-wiki"
