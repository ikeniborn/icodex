
# Code graph is a local Git/stdio cache for Python only. This repository is Bash,
# so keep it disabled. To enable it for a Python project, set enabled = true and
# uncomment or adjust the bounded settings below.
read = ["iclaude", "icodex", "iwiki-mcp", "devops"]
write = ["icodex", "devops", "icodex"]
primary = "icodex"
[code_graph]
enabled = true
languages = ["python","typescript"]
auto_rebuild = "bounded"
max_rebuild_seconds = 1800
max_full_rebuild_seconds = 1800
max_file_bytes = 100000000
max_total_files = 20000
include_tests = false
exclude = [
  ".worktrees/",
  "tests/fixtures/",
  "build/",
  "dist/",
  "*.generated.py",
  "*.generated.ts",
  "vendor/",
  "node_modules/",
  ".superpowers/",
  ".pytest_cache/",
  ".ruff_cache/",
]
typescript_type_boost = false
publish_mode = "mcp"
read_mode = "mcp"
max_snapshot_age_seconds = 86400
max_batch_rows = 1000
max_batch_bytes = 1000000
publication_session_ttl_seconds = 1800
staging_retention_seconds = 86400
staging_cleanup_limit = 100

# Local stdio PostgreSQL examples: replace the Git binding above with exactly
# one block below. Keep IWIKI_DB_PASSWORD out of this file; set
# ICODEX_IWIKI_DB_PASSWORD in .codex_config instead.
#
# Local/internal database for development. `sslmode = "disable"` is appropriate
# only when PostgreSQL listens on this machine.
# read = ["icodex"]
# write = ["icodex"]
# primary = "icodex"
#
# [storage]
# type = "postgres"
# host = "127.0.0.1"
# port = 5432
# database = "iwiki_dev"
# user = "iwiki_app"
# sslmode = "disable"
# iwiki_id = "icodex-dev"
#
# External PostgreSQL database. Use verify-full with a trusted CA and a hostname
# matching the server certificate.
# read = ["icodex"]
# write = ["icodex"]
# primary = "icodex"
#
# [storage]
# type = "postgres"
# host = "db.example.com"
# port = 5432
# database = "iwiki"
# user = "iwiki_app"
# sslmode = "verify-full"
# iwiki_id = "team-wiki"
